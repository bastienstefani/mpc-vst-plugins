# Osmium skin, laid out for a 4-knob MPC (Live II, One, Key 37): every Q-Link column is one frame of four controls
# stacked top to bottom, in the order of the four physical knobs; the Q-Link button moves to the next column and
# qlink_bounds=column outlines the one in use. Frames sit left of x=1010 (MPC's Q-Link sidebar covers x >= ~1025
# while a knob is touched); the strip on the right only carries text.
# Geometry: frames x = 10 + 252*c, w 244, y 96..704; slot tops 136, 276, 416, 556; knob cy = top+38 (r 28);
# popup / segment cy = top+64. Regenerate nothing by hand: this file is the source of the skin (tools/shadow_skin.py).
theme_bg=0b0e12
theme_panel=12171d
theme_line=27303a
theme_ink=e6ebf0
theme_ink_dim=8d98a5
theme_ink_faint=56606b
theme_accent=3fc6d6
theme_accent_hi=a6ecf5
theme_knob_face=1b222b
theme_knob_ring=2f3a46
theme_knob_dot=3fc6d6
theme_lcd=0f1419
theme_btn_text=0b0e12
theme_tile_on=223040
theme_seg_active=3fc6d6
theme_seg_inactive=161c23
